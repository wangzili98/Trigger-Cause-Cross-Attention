name: TCA minimum example
on: [push, pull_request, workflow_dispatch]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "numpy==2.4.0"
      - run: python -m pip install "torch==2.7.1" --index-url https://download.pytorch.org/whl/cpu
      - run: python -B -m unittest discover -s tests -v
      - run: python -B train/train_tca.py --device cpu
      - run: python -B train/run_tca.py --device cpu
